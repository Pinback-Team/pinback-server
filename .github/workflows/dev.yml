name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2.9
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Build and test
        run: ./gradlew clean build --no-daemon --build-cache --parallel --max-workers=4
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: api/build/libs/*.jar

  docker-build-and-push:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: api/build/libs/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push tested application
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pinback:prod
            ${{ secrets.DOCKER_USERNAME }}/pinback:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      GCP_HOST: ${{ secrets.GCP_SSH_HOST }}
      GCP_USER: ${{ secrets.GCP_SSH_USERNAME }}
      DEPLOY_DIR: /home/gksql6630/pinback
      APP_IMAGE: ${{ secrets.DOCKER_USERNAME }}/pinback@${{ needs.docker-build-and-push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified SSH connection
        env:
          SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.GCP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$GCP_HOST"
          test -n "$GCP_USER"
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy application to GCP
        run: |
          set -euo pipefail
          [[ "$APP_IMAGE" =~ ^[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$GCP_USER@$GCP_HOST" "bash -s -- '$DEPLOY_DIR' '$APP_IMAGE'" <<'REMOTE'
          set -euo pipefail
          umask 077
          cd "$1"
          docker pull "$2"
          printf '{"services":{"pinback":{"image":"%s"}}}\n' "$2" > compose.image.yaml
          docker compose --env-file pinback.env -f compose.yaml -f compose.image.yaml \
            up -d --no-deps --wait --wait-timeout 600 pinback
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8080/api/v1/test/health
          REMOTE
      - name: Verify public HTTPS endpoint
        run: curl --fail --silent --show-error --retry 3 --max-time 20 https://34.50.8.189.nip.io/api/v1/test/health
      - name: Remove runner SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
